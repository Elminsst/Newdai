<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    }

    .login-box {
      width: 360px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 40px 36px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-circle {
      width: 52px;
      height: 52px;
      background: #3b82f6;
      border-radius: 12px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      font-weight: 600;
    }

    .logo h1 {
      font-size: 20px;
      color: #1f2937;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #3b82f6;
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4b5563;
      cursor: pointer;
    }

    .options a {
      color: #3b82f6;
      text-decoration: none;
    }

    .options a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      height: 44px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #2563eb;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: #6b7280;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
      margin-left: 4px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-circle">A</div>
      <h1>账号登录</h1>
    </div>

    <div class="form-group">
      <label>用户名 / 邮箱</label>
      <input type="text" placeholder="请输入用户名或邮箱" readonly>
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" placeholder="请输入密码" readonly>
    </div>

    <div class="options">
      <label>
        <input type="checkbox"> 记住我
      </label>
      <a href="#">忘记密码？</a>
    </div>

    <button class="btn">登 录</button>

    <div class="footer">
      还没有账号？<a href="#">立即注册</a>
    </div>
  </div>
</body>
</html>
